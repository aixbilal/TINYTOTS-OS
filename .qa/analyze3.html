<!doctype html>
<html>
<body>
<pre id="out"></pre>
<script>
const img = new Image();
img.onload = () => {
  const W = img.naturalWidth, H = img.naturalHeight;
  const cv = document.createElement("canvas");
  cv.width = W; cv.height = H;
  const ctx = cv.getContext("2d", { willReadFrequently: true });
  ctx.drawImage(img, 0, 0);
  const d = ctx.getImageData(0, 0, W, H).data;
  const lum = (x, y) => { const i = (y * W + x) * 4; return 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]; };
  const lines = [];
  const bbox = (name, x0, y0, x1, y1, thresh = 18) => {
    const vals = [];
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) vals.push(lum(x, y));
    vals.sort((a, b) => a - b);
    const bg = vals[Math.floor(vals.length / 2)];
    let minX = 1e9, minY = 1e9, maxX = -1, maxY = -1;
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
      if (Math.abs(lum(x, y) - bg) > thresh) {
        if (x < minX) minX = x; if (x > maxX) maxX = x;
        if (y < minY) minY = y; if (y > maxY) maxY = y;
      }
    }
    lines.push(maxX < 0 ? `${name}: none (bg ${bg.toFixed(0)})`
      : `${name}: x ${minX}..${maxX} (w ${maxX - minX + 1}) y ${minY}..${maxY} (h ${maxY - minY + 1}) bg ${bg.toFixed(0)}`);
  };
  const vlines = (y, x0, x1, thresh = 5) => {
    const hits = [];
    for (let x = x0 + 2; x <= x1 - 2; x++) {
      const v = lum(x, y);
      if (v < lum(x - 2, y) - thresh && v < lum(x + 2, y) - thresh) hits.push(x);
    }
    lines.push(`VLINES y=${y}: ${hits.join(" ")}`);
  };
  const hlines = (x, y0, y1, thresh = 5) => {
    const hits = [];
    for (let y = y0 + 2; y <= y1 - 2; y++) {
      const v = lum(x, y);
      if (v < lum(x, y - 2) - thresh && v < lum(x, y + 2) - thresh) hits.push(y);
    }
    lines.push(`HLINES x=${x}: ${hits.join(" ")}`);
  };

  bbox("headingLine1", 25, 98, 265, 146);
  bbox("headingLine2", 25, 146, 265, 195);
  bbox("ctaLabel", 44, 282, 172, 300, 25);
  bbox("badgeCircle", 440, 60, 560, 150, 6);
  bbox("badgeText", 480, 90, 520, 120, 20);
  bbox("featureBlock", 505, 175, 640, 250, 8);
  bbox("featureRow1", 505, 178, 640, 200, 8);
  bbox("trustIcon1", 40, 460, 90, 508, 6);
  bbox("trustHead1", 88, 462, 260, 480, 10);
  bbox("trustDesc1", 88, 480, 260, 500, 10);
  bbox("featuredDesc2", 25, 380, 260, 412, 10);
  bbox("featuredLink2", 25, 418, 260, 440, 10);
  bbox("avatar1b", 172, 538, 268, 622, 8);
  bbox("quote1b", 255, 578, 520, 615, 10);
  bbox("dots2", 470, 618, 560, 640, 6);
  bbox("qr2", 900, 600, 1015, 680, 10);
  bbox("globeIcon", 28, 645, 60, 672, 10);
  bbox("socialRow", 495, 645, 580, 675, 6);
  bbox("statDivider1", 860, 130, 1015, 142, 4);
  bbox("statDivider2", 860, 216, 1015, 228, 4);
  bbox("stat3icon", 862, 228, 1010, 258, 6);
  vlines(136, 850, 1015, 3);
  hlines(60, 200, 320, 4);
  vlines(295, 20, 260, 6);
  hlines(90, 20, 320, 4);
  // Banner extents: scan for the vertical seam at the banner edges.
  vlines(20, 250, 900, 2);
  vlines(260, 250, 900, 2);
  hlines(600, 0, 330, 2);
  hlines(300, 0, 330, 2);
  document.getElementById("out").textContent = lines.join("\n");
};
img.src = "reference.png";
</script>
</body>
</html>
