<!doctype html>
<html>
<body>
<pre id="out"></pre>
<script>
const img = new Image();
img.onload = () => {
  const W = img.naturalWidth, H = img.naturalHeight;
  const cv = document.createElement("canvas");
  cv.width = W; cv.height = H;
  const ctx = cv.getContext("2d", { willReadFrequently: true });
  ctx.drawImage(img, 0, 0);
  const d = ctx.getImageData(0, 0, W, H).data;
  const lum = (x, y) => { const i = (y * W + x) * 4; return 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]; };
  const lines = [];

  // Bounding box of "ink" (pixels differing from the region median) inside a rect.
  const bbox = (name, x0, y0, x1, y1, thresh = 18) => {
    const vals = [];
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) vals.push(lum(x, y));
    vals.sort((a, b) => a - b);
    const bg = vals[Math.floor(vals.length / 2)];
    let minX = 1e9, minY = 1e9, maxX = -1, maxY = -1;
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
      if (Math.abs(lum(x, y) - bg) > thresh) {
        if (x < minX) minX = x; if (x > maxX) maxX = x;
        if (y < minY) minY = y; if (y > maxY) maxY = y;
      }
    }
    lines.push(
      maxX < 0
        ? `${name}: none (bg ${bg.toFixed(0)})`
        : `${name}: x ${minX}..${maxX} (w ${maxX - minX + 1}) y ${minY}..${maxY} (h ${maxY - minY + 1}) bg ${bg.toFixed(0)}`
    );
  };

  // Positions of thin darker vertical lines along a row (card borders).
  const vlines = (y, x0, x1, thresh = 5) => {
    const hits = [];
    for (let x = x0 + 2; x <= x1 - 2; x++) {
      const v = lum(x, y);
      if (v < lum(x - 2, y) - thresh && v < lum(x + 2, y) - thresh) hits.push(x);
    }
    lines.push(`VLINES y=${y}: ${hits.join(" ")}`);
  };
  const hlines = (x, y0, y1, thresh = 5) => {
    const hits = [];
    for (let y = y0 + 2; y <= y1 - 2; y++) {
      const v = lum(x, y);
      if (v < lum(x, y - 2) - thresh && v < lum(x, y + 2) - thresh) hits.push(y);
    }
    lines.push(`HLINES x=${x}: ${hits.join(" ")}`);
  };

  lines.push(`size ${W}x${H}`);
  // Hero left column
  bbox("logo", 20, 8, 220, 58);
  bbox("brandline", 20, 58, 220, 72);
  bbox("eyebrow", 20, 84, 240, 100);
  bbox("heading", 20, 100, 260, 200);
  bbox("divider", 20, 198, 140, 214);
  bbox("subtitle", 20, 210, 260, 230);
  bbox("description", 20, 230, 260, 268);
  bbox("cta", 20, 270, 260, 312);
  // Stats column
  bbox("stat1icon", 862, 52, 1010, 82);
  bbox("stat1num", 862, 84, 1010, 112);
  bbox("stat1label", 862, 112, 1010, 128);
  bbox("stat2icon", 862, 140, 1010, 172);
  bbox("stat2num", 862, 172, 1010, 200);
  bbox("stat2label", 862, 200, 1010, 214);
  bbox("stat3num", 862, 258, 1010, 288);
  bbox("stat3label", 862, 288, 1010, 300);
  // Badge + feature list on banner
  bbox("badge", 460, 70, 545, 140, 10);
  bbox("features", 515, 180, 600, 240);
  // Featured collection
  bbox("featuredHeading", 20, 330, 170, 372);
  bbox("featuredDivider", 20, 372, 120, 384);
  bbox("featuredDesc", 20, 384, 200, 410);
  bbox("featuredLink", 20, 415, 200, 440);
  vlines(350, 160, 1010, 4);
  vlines(430, 160, 1010, 4);
  hlines(222, 315, 450, 4);
  hlines(430, 315, 450, 4);
  // Trust strip
  hlines(200, 440, 525, 3);
  vlines(484, 30, 1000, 3);
  bbox("trustIcon1", 44, 462, 78, 500, 12);
  bbox("trustText1", 88, 462, 250, 500, 12);
  // Testimonials
  bbox("testimonialTitle", 300, 518, 730, 540);
  vlines(575, 20, 1010, 3);
  hlines(340, 520, 640, 3);
  hlines(690, 520, 640, 3);
  bbox("arrowLeft", 30, 545, 90, 605, 8);
  bbox("arrowRight", 935, 545, 1000, 605, 8);
  bbox("avatar1", 180, 545, 245, 610, 10);
  bbox("stars1", 250, 545, 340, 566, 10);
  bbox("name1", 250, 562, 400, 578, 10);
  bbox("quote1", 250, 578, 500, 615, 10);
  bbox("dots", 480, 620, 545, 636, 8);
  // Footer
  bbox("footerText", 30, 645, 200, 675, 10);
  bbox("followUs", 420, 645, 500, 672, 10);
  bbox("socialIcons", 495, 645, 580, 675, 10);
  bbox("scanToShop", 830, 645, 925, 675, 10);
  bbox("qr", 920, 615, 1000, 682, 10);
  document.getElementById("out").textContent = lines.join("\n");
};
img.src = "reference.png";
</script>
</body>
</html>
